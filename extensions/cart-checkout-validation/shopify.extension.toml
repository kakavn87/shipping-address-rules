api_version = "2026-10"

[[extensions]]
name = "Shipping Address Rules"
handle = "shipping-address-rules"
type = "function"
uid = "4f7d7c5e-7c2d-4e44-9b19-0f8a8d9b3f21"
description = "Blocks restricted shipping addresses at checkout."

[[extensions.targeting]]
target = "cart.validations.generate.run"
input_query = "src/cart_validations_generate_run.graphql"
export = "run"

[extensions.build]
command = "npm run build"
path = "dist/function.wasm"
watch = ["src/**/*.js", "src/**/*.graphql"]

[access_scopes]
scopes = ""
